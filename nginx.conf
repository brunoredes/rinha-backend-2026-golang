# Minimal LB: round-robin two API replicas on the bridge network.
# No request inspection, no rewrites — keeps the LB outside the
# detection logic per the spec.

worker_processes 1;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 10000;

    upstream api {
        server api1:9999 max_fails=0;
        server api2:9999 max_fails=0;
        keepalive 64;
    }

    server {
        listen 9999 default_server;
        server_name _;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
            proxy_connect_timeout 1s;
        }
    }
}
